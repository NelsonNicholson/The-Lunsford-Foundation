<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Lunsford Foundation · Giving</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2326343D'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%23F7F5F1' text-anchor='middle' letter-spacing='1'%3ELF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261029b">
</head>
<body>

<!-- Passphrase gate -->
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="logo logo-lg">
      <div class="logo-top"><span class="rule"></span><span>THE LUNSFORD</span><span class="rule"></span></div>
      <div class="logo-bottom">FOUNDATION</div>
    </div>
    <p class="gate-sub">Private giving dashboard</p>
    <form id="gateForm" autocomplete="off">
      <label for="pp" class="sr">Passphrase</label>
      <input id="pp" type="password" placeholder="Enter passphrase" autocomplete="current-password" required>
      <label class="remember"><input type="checkbox" id="remember"> Remember on this device</label>
      <button type="submit" class="btn btn-primary btn-block">Unlock</button>
      <p id="gateErr" class="gate-err" role="alert"></p>
    </form>
  </div>
</div>

<!-- App -->
<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/giving" class="logo logo-sm" aria-label="The Lunsford Foundation — Giving home">
        <div class="logo-top"><span class="rule"></span><span>THE LUNSFORD</span><span class="rule"></span></div>
        <div class="logo-bottom">FOUNDATION</div>
      </a>
      <nav class="nav" id="nav">
        <a href="#/giving" data-view="giving">2026 Giving</a>
        <a href="#/history" data-view="history">Giving History</a>
        <a href="#/organizations" data-view="organizations">Organizations</a>
        <a href="#/funding" data-view="funding">Funding Sources</a>
      </nav>
      <div class="topbar-actions">
        <a href="#/budget" class="btn btn-gold" data-view="budget">Create a 2027 Budget</a>
        <button class="icon-btn" id="lockBtn" title="Lock dashboard" aria-label="Lock dashboard">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="main"></main>

  <footer class="foot">
    <span>The Lunsford Foundation · Holt &amp; Kaye Dawn Lunsford</span>
    <span id="footAsOf"></span>
  </footer>
</div>

<!-- Drill-down drawer -->
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <button class="drawer-close" id="drawerClose" aria-label="Close">&times;</button>
  <div id="drawerBody"></div>
</aside>

<div id="tooltip" class="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js?v=20261029b"></script>
</body>
</html>
